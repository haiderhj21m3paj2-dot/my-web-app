<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة التحميل</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .btn { background-color: #0070f3; color: white; padding: 12px 24px; border: none; border-radius: 6px; text-decoration: none; font-size: 18px; display: inline-block; margin-top: 15px; }
        .btn:hover { background-color: #0051a8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>مرحباً بك في تطبيق الويب الخاص بي 🚀</h2>
        <p>اضغط على الزر أدناه لتنزيل الملف مباشرة:</p>
        <a href="/download" class="btn">تحميل الملف الآن</a>
    </div>
</body>
</html>
